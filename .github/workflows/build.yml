name: Build Flutter AAB

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install Dependencies & Launcher Icons
        run: |
          flutter pub get
          dart run flutter_launcher_icons

# ----------------------------------------------------
      # ১. যদি AAB ফাইল বানাতে চান, নিচের কোডের সামনের # তুলে দিন 
      # এবং APK এর অংশটুকু কমেন্ট করে দিন
      # ----------------------------------------------------
       - name: Build App Bundle (AAB)
         run: flutter build appbundle --release

       - name: Upload AAB Artifact
         uses: actions/upload-artifact@v4
         with:
           name: release-aab
           path: build/app/outputs/bundle/release/app-release.aab


      # ----------------------------------------------------
      # ২. বর্তমানে APK বিল্ড করার অংশটি চালু আছে (টেস্ট করার জন্য)
